name: tick
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil bot
        run: |
          curl -sS --fail-with-body --retry 3 --max-time 120 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.BOT_URL }}/api/tick"