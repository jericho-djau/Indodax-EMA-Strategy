name: tick
on:
  schedule: [{ cron: '7 * * * *' }]     # menit ke-7 tiap jam (hindari menit 0)
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS --retry 3 --max-time 120 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.BOT_URL }}/api/tick"
